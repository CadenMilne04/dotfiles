# # Some basic gruvbox-dark colors.
set -g @gruvbox_bg "#282828"        # Background
set -g @gruvbox_fg "#ebdbb2"        # Foreground / Light text
set -g @gruvbox_surface_1 "#3c3836" # A darker shade for panels
set -g @gruvbox_mauve "#d3869b"     # Similar to mauve (Gruvbox purple)
set -g @gruvbox_crust "#1d2021"     # Very dark, for deeper contrast

# # status line
set -gF status-style "bg=#{@gruvbox_bg},fg=#{@gruvbox_fg}"
set -gF window-status-style "bg=#{@gruvbox_surface_1},fg=#{@gruvbox_fg}"
set -gF window-status-current-style "bg=#{@gruvbox_mauve},fg=#{@gruvbox_crust}"
